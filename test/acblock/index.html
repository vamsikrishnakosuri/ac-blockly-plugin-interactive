<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP - Blockly Playground</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/gh/google/code-prettify@master/loader/run_prettify.js"></script>
    <script src="./lib/blockly_compressed.js"></script>
    <script src="./lib/blocks_compressed.js"></script>
    <script src="./lib/javascript_compressed.js"></script>
    <script src="./lib/python_compressed.js"></script>
    <script src="./lib/php_compressed.js"></script>
    <script src="./lib/lua_compressed.js"></script>
    <script src="./lib/dart_compressed.js"></script>
    <script src="./lib/msg/en.js"></script>
    <script src="./keyboard-navigation/index.js"></script>
    <script src="./js/Toolbox.js"></script>
    <script src="./js/main.js"></script>
</head>
<body onload="initWorkspace()">
  <div id="root">
    <nav class="navbar">
        <div class="logo">
            <img src="blockly.png" class="logo" alt="Blockly Logo">
            <h1>Blockly Playground</h1>
        </div>
    </nav>
    <div style="display: flex; height: 90%;">
        <div role="application"
             tabindex="0"
             aria-label="Blockly workspace"
             style="flex:2; position:relative;">
            <div id="blocklyDiv" class="editor-panel"></div>
        </div>
        <div id="blockReader"
             class="visually-hidden"
             aria-live="assertive"
             aria-atomic="true"
             role="status"></div>
        <div class="execution-panel">
            <!-- Header row: Run + program picker -->
            <div class="exec-header" role="group" aria-label="Run and Select Program">
                <button id="runButton" class="run-button">
                    Run <i class="fas fa-play-circle" aria-hidden="true"></i>
                </button>

                <div class="program-controls">
                    <label class="sr-only" for="programSelect">Choose a program</label>
                    <select id="programSelect" class="program-dropdown" aria-describedby="programHelp">
                        <option value="">None — select a program…</option>
                        <!-- options filled by JS -->
                    </select>
                    <button id="loadXmlButton" class="run-button" aria-describedby="programHelp">Load Program</button>
                    <div id="programHelp" class="sr-only">Select a program, then press Load Program to load blocks.</div>
                </div>
            </div>

            <!-- Code panel -->
            <div class="code-container" aria-labelledby="codeHeader">
                <div class="code-header">
                    <h3 id="codeHeader">Code</h3>
                    <label class="sr-only" for="languageSelect">Language</label>
                    <select id="languageSelect" class="program-dropdown program-dropdown--sm">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="php">PHP</option>
                        <option value="lua">Lua</option>
                        <option value="dart">Dart</option>
                        <option value="xml">XML</option>
                    </select>
                </div>
                <pre id="codeOutput" class="prettyprint" style="border: none"><code class="language-javascript"></code></pre>
            </div>

            <!-- Instruction (appears only when a program is selected) -->
            <section id="instructionSection" class="instruction" hidden aria-labelledby="instructionHeader">
                <h3 id="instructionHeader">
                    <div class="instruction-header-row" role="toolbar" aria-label="Instruction navigation">
                        <span class="instruction-title">Instruction</span>
                        <button id="instructionPrev" class="instruction-nav" type="button" aria-label="Previous scenario" title="Previous (←)">‹</button>
                        <span id="instructionPager" class="instruction-pager" aria-live="polite"></span>
                        <button id="instructionNext" class="instruction-nav" type="button" aria-label="Next scenario" title="Next (→)">›</button>
                    </div>
                </h3>
                <div id="instructionBody" class="instruction-body"></div>
            </section>

            <!-- Keyboard hints (always visible) -->
            <section class="keyboard-hints" aria-labelledby="kbdHeader">
                <div class="kbd-head">
                    <h4 id="kbdHeader">Navigational Hint</h4>
                    <button id="showShortcuts" class="run-button" type="button" title="Show all shortcuts (Ctrl+H)">
                        Shortcuts <i class="fas fa-circle-info" aria-hidden="true"></i>
                    </button>
                </div>
                <dl id="keyboardHintList" class="kbd-list" aria-live="polite"></dl>
            </section>
        </div>
    </div>
  </div>
</body>
</html>
